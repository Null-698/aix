name: Build Temple Scan AIX
on:
  push:
    branches: [main]
    paths:
      - 'sources/en.templescan/**'
      - '.github/workflows/build-templescan.yml'
      - '.github/actions/install-aidoku-cli/**'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust and WASM target
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.99.0'
          components: rustfmt
          targets: wasm32-unknown-unknown
      - name: Install Aidoku CLI
        uses: ./.github/actions/install-aidoku-cli
      - name: Format Rust
        run: cargo fmt --manifest-path sources/en.templescan/Cargo.toml
      - name: Package Temple Scan
        working-directory: sources/en.templescan
        run: aidoku package
      - name: Verify package
        run: |
          set -euo pipefail
          test -s sources/en.templescan/package.aix
          aidoku verify sources/en.templescan/package.aix
          unzip -t sources/en.templescan/package.aix
          mkdir -p dist
          cp sources/en.templescan/package.aix dist/en.templescan-v12.aix
      - name: Upload AIX build artifact
        uses: actions/upload-artifact@v4
        with:
          name: en.templescan-v12
          path: dist/en.templescan-v12.aix
          if-no-files-found: error
      - name: Publish AIX as GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="templescan-v12"
          if gh release view "$tag" > /dev/null 2>&1; then
            gh release upload "$tag" dist/en.templescan-v12.aix --clobber
          else
            gh release create "$tag" dist/en.templescan-v12.aix \
              --target "$GITHUB_SHA" \
              --title "Temple Scan v12 (Aidoku)" \
              --notes "Fixed chapter numbers, site-powered listings, sorting, search and page loading. Modified from PoppingMangoSources."
          fi
